<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>engsim viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  body { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #d7dde8; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* The HUD is laid out on a fixed 1920x1080 board and scaled to the window. */
  #hud { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
  .dim { color: #7c8698; }
  #label { position: absolute; left: 56px; top: 44px; font-size: 30px; letter-spacing: 0.02em; color: #eef2f8; }
  #sub { position: absolute; left: 56px; top: 86px; font-size: 18px; color: #7c8698; }
  #caption { position: absolute; left: 56px; top: 118px; font-size: 20px; color: #c9d2e0; max-width: 900px; white-space: pre-line; }
  #firing { position: absolute; right: 56px; top: 46px; display: flex; gap: 10px; align-items: flex-end; }
  #firing .cyl { width: 26px; text-align: center; font-size: 13px; color: #7c8698; }
  #firing .lamp { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #39404d; margin-bottom: 5px; box-sizing: border-box; }
  #firingcap { position: absolute; right: 56px; top: 104px; font-size: 13px; color: #7c8698; }
  #legend { position: absolute; right: 56px; top: 150px; width: 300px; }
  #legendbar { width: 300px; height: 12px; border-radius: 2px; }
  #legend .ticks { display: flex; justify-content: space-between; font-size: 13px; color: #9aa4b5; margin-top: 4px; }
  #legend .cap { font-size: 13px; color: #7c8698; margin-top: 3px; text-align: right; }
  #tag { font-size: 14px; color: #c9d2e0; margin-top: 14px; text-align: right; white-space: pre-line; }
  #rpmbox { position: absolute; left: 56px; bottom: 50px; width: 520px; }
  #rpm { font-size: 76px; line-height: 1; color: #f3f6fb; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  #rpm span { font-size: 22px; color: #7c8698; margin-left: 10px; letter-spacing: 0.05em; }
  #tach { position: relative; height: 12px; margin-top: 14px; background: #161a22; border-radius: 2px; overflow: hidden; }
  #tachred { position: absolute; top: 0; bottom: 0; right: 0; background: #4a1414; }
  #tachfill { position: absolute; top: 0; bottom: 0; left: 0; background: #e9edf4; }
  #tachticks { display: flex; justify-content: space-between; font-size: 12px; color: #667083; margin-top: 4px; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 15px; color: #7c8698; }
  #thr { position: relative; width: 200px; height: 8px; background: #161a22; border-radius: 2px; overflow: hidden; }
  #thrfill { position: absolute; top: 0; bottom: 0; left: 0; background: #6fd3a5; }
  #gear, #cut { color: #d7dde8; }
  #cut { color: #ffb347; visibility: hidden; }
  #scopebox { position: absolute; right: 56px; bottom: 50px; width: 760px; }
  #scope { width: 760px; height: 130px; display: block; }
  #scopecap { font-size: 13px; color: #7c8698; margin-top: 4px; display: flex; justify-content: space-between; }
  #ui { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: none; gap: 10px; align-items: center; font-size: 13px; pointer-events: auto; }
  #ui button { font: inherit; color: #d7dde8; background: #1a1f29; border: 1px solid #39404d; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
  #ui input { width: 360px; }
  #err { position: fixed; left: 20px; top: 20px; color: #ff8a8a; font-size: 14px; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor.nosync/node_modules/three/build/three.module.js",
    "three/addons/": "./vendor.nosync/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="label"></div>
  <div id="sub"></div>
  <div id="caption"></div>
  <div id="firing"></div>
  <div id="firingcap">combustion, per cylinder</div>
  <div id="legend">
    <div id="legendbar"></div>
    <div class="ticks"><span id="lgneg"></span><span>0</span><span id="lgpos"></span></div>
    <div class="cap" id="legendcap">gas pressure relative to ambient, bar</div>
    <div id="tag"></div>
  </div>
  <div id="rpmbox">
    <div id="rpm">0<span>RPM</span></div>
    <div id="tach"><div id="tachred"></div><div id="tachfill"></div></div>
    <div id="tachticks"></div>
    <div class="row"><span>THROTTLE</span><div id="thr"><div id="thrfill"></div></div><span id="gear"></span><span id="cut">FUEL CUT</span></div>
  </div>
  <div id="scopebox">
    <canvas id="scope" width="1520" height="260"></canvas>
    <div id="scopecap"><span>sound pressure at the microphone (the audio track)</span><span id="scopewin"></span></div>
  </div>
</div>
<div id="ui"><button id="play">play</button><input id="seek" type="range" min="0" max="1" value="0"><span id="uiinfo"></span></div>
<div id="err"></div>
<script type="module" src="./main.js"></script>
</body>
</html>
