[package]
name = "engsim"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # exact float parsing: engine definitions must load bit-for-bit

[features]
# section timers and counters (sim/src/prof.rs); off in every shipped build
prof = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
